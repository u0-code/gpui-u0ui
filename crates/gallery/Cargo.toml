[package]
name = "u0ui-gallery"
description = "Interactive gallery for u0ui"
version.workspace = true
edition.workspace = true
license = "Apache-2.0 AND OFL-1.1"
rust-version.workspace = true
publish = false

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
u0ui.workspace = true
# `Window::render_to_image`, which `--capture` draws with, is behind test-support.
gpui-kit = { workspace = true, features = ["test-support"] }
anyhow.workspace = true
