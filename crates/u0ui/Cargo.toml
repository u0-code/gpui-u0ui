[package]
name = "u0ui"
description = "Carbon UI: IBM Carbon v11 visuals with a shadcn-style API for GPUI Kit"
version.workspace = true
edition.workspace = true
license = "Apache-2.0 AND OFL-1.1"
rust-version.workspace = true
repository.workspace = true
homepage = "https://github.com/u0-code/gpui-u0ui"
documentation = "https://docs.rs/u0ui"
readme = "../../README.md"
keywords = ["gpui", "carbon", "ui", "components", "design-system"]
categories = ["gui"]

[dependencies]
gpui-kit.workspace = true
gpui-base.workspace = true
gpui-material-symbols.workspace = true
# "Today" in the local time zone (Calendar, DatePicker); already in the tree via GPUI.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# QR encoding for `u0::primitives::QRCode` (MIT OR Apache-2.0), without its image/SVG renderers.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`, `gpui_kit::test`).
gpui-kit = { workspace = true, features = ["test-support"] }

# Lays text out with the platform text system, which must live on the main thread.
[[test]]
name = "terminal_view_wrap"
harness = false
