[package]
name = "u0ui"
description = "Carbon UI: IBM Carbon v11 visuals with a shadcn-style API for GPUI Kit"
version.workspace = true
edition.workspace = true
license = "Apache-2.0 AND OFL-1.1"
rust-version.workspace = true
repository.workspace = true

[dependencies]
gpui-kit.workspace = true
gpui-base.workspace = true
gpui-material-symbols.workspace = true
# "Today" in the local time zone (Calendar, DatePicker); already in the tree via GPUI.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# QR encoding for `ghost::primitives::QRCode` (MIT OR Apache-2.0), without its image/SVG renderers.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`, `gpui_kit::test`).
gpui-kit = { workspace = true, features = ["test-support"] }
